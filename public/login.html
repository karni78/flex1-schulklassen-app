<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5b5bd6"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Flex 1"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icons/icon-192.svg"><title>Flex 1 · Zugang</title><link rel="stylesheet" href="/style.css"></head><body class="login-body"><div class="login-wrap"><div class="login-card"><div class="login-logo">F1</div><span class="eyebrow">Schulklassen-App</span><h1>Willkommen bei <em>Flex 1</em></h1><p>Gemeinsam wachsen · lernen · erleben</p><form id="loginForm"><div class="password-field"><span>🔒</span><input id="password" type="password" placeholder="Klassenpasswort" required></div><button type="submit">Anmelden <span>→</span></button></form><div id="error" class="error"></div><div class="login-doodle">♡ Eine starke Klasse! ♡</div></div></div><script>document.querySelector('#loginForm').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.querySelector('#password').value})});if(r.ok)location='/';else document.querySelector('#error').textContent='Das Passwort stimmt leider nicht.'}</script></body></html>
